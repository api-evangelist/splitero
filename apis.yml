aid: splitero
name: Splitero
description: 'Splitero is a San Diego, California fintech founded in 2021 by Michael Gifford and David
  Zvaifler that originates Home Equity Investments (HEIs) — a lump sum of cash, up to $500,000, paid to
  a homeowner today in exchange for a share of the home''s future value, with no monthly payments, no
  income requirement, credit scores accepted from 500, and terms of up to 30 years. The company operates
  a consumer application and servicing portal at my.splitero.com, funds its originations through institutional
  capital commitments (including a $350M facility led by Blue Owl Capital), and has expanded into a licensed
  residential brokerage, Splitero Homes. Splitero is an end-user consumer finance product: it publishes
  no developer portal, no public API, no SDKs and no machine-readable contract of any kind.'
